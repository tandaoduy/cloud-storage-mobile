name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  mobile-quality:
    name: Mobile quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo lint

  backend-integration:
    name: Backend integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL and FastAPI
        run: docker compose up --build --detach
      - name: Wait for health endpoint
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/health; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Verify registration and login
        run: |
          curl --fail --silent --show-error --request POST http://127.0.0.1:8000/api/v1/auth/register --header 'Content-Type: application/json' --data '{"email":"ci@example.com","password":"ci-password-123","display_name":"CI User"}' > register.json
          grep -q 'access_token' register.json
          curl --fail --silent --show-error --request POST http://127.0.0.1:8000/api/v1/auth/login --header 'Content-Type: application/json' --data '{"email":"ci@example.com","password":"ci-password-123"}' > login.json
          grep -q 'refresh_token' login.json
      - name: Print API logs on failure
        if: failure()
        run: docker compose logs api
