services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cloudbox
      POSTGRES_USER: cloudbox
      POSTGRES_PASSWORD: cloudbox
    ports: ["5432:5432"]
    # Bind mounts keep development data even after `docker compose down -v`,
    # a Docker-volume prune, or a Compose project-name change.
    volumes: ["./.data/postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudbox -d cloudbox"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://cloudbox:cloudbox@db:5432/cloudbox
      ALLOWED_ORIGINS: http://localhost:8081,http://127.0.0.1:8081
    ports: ["8000:8000"]
    volumes: ["./.data/uploads:/app/uploads"]
    command: sh -c "alembic upgrade head && fastapi run app/main.py --host 0.0.0.0 --port 8000"
    depends_on:
      db: { condition: service_healthy }
